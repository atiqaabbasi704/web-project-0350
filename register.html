<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Lens & Light</title>

    <link rel="stylesheet" href="css/register.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>

        <nav>

            <h2>Lens & Light</h2>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="media.html">About & Media</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>

    </header>


    <main>

        <section id="registration">

            <h1>Book Your Photography Session</h1>

            <p>Fill out the form below to register for your session.</p>


            <form>

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>


                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>


                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>


                <label for="session">Select Photography Session</label>

                <select id="session" required>

                    <option value="">Choose a session</option>
                    <option value="Portrait">Portrait Photography</option>
                    <option value="Wedding">Wedding Photography</option>
                    <option value="Event">Event Photography</option>
                    <option value="Product">Product Photography</option>

                </select>


                <label for="date">Preferred Date</label>
                <input type="date" id="date" required>


                <label for="message">Additional Details</label>
                <textarea id="message" rows="4"
                    placeholder="Tell us about your photography requirements"></textarea>


                <button type="submit">Submit Registration</button>

            </form>

        </section>

    </main>

</body>

</html>
